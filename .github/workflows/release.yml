name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        run: ./build.sh ${{ steps.ver.outputs.version }}

      - name: Empaquetar (zip + dmg)
        run: |
          mkdir -p dist
          V=${{ steps.ver.outputs.version }}
          ditto -c -k --keepParent build/OpenFortiBar.app dist/OpenFortiBar-$V.zip
          mkdir -p build/dmg && cp -R build/OpenFortiBar.app build/dmg/ && ln -s /Applications build/dmg/Applications
          hdiutil create -volname "OpenForti Bar" -srcfolder build/dmg -format UDZO dist/OpenFortiBar-$V.dmg
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFortiBar-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Notas del release (desde CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=${{ steps.ver.outputs.version }}
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > build/notes.md
          test -s build/notes.md || { echo "Falta la sección [$V] en CHANGELOG.md"; exit 1; }
          printf '\n---\n**Instalación:** descarga el `.dmg`, arrastra la app a Aplicaciones y la primera vez ábrela con clic derecho → Abrir.\n' >> build/notes.md

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: build/notes.md
